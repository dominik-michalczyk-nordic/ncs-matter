name: SDK Sync

on:
  schedule:
# Every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      force_pr:
        description: 'Open sync PR even when all builds pass'
        required: false
        type: boolean
        default: false
      revisions:
        description: 'Optional revision overrides, comma-separated name=sha (see SDK_SYNC_PROJECTS)'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.repository }}-sdk-sync
  cancel-in-progress: true

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 2G
  CCACHE_SLOPPINESS: file_macro,time_macros,include_file_mtime,include_file_ctime
  WEST_PATH_CACHE: ${{ github.workspace }}/west-path-cache
  PIP_CACHE_DIR: ${{ github.workspace }}/.pip-cache
  # Checkout directory for the add-on repository, matching the convention used by this
  # repository's other workflows (compliance.yml, sample-validation.yml, west-zap.yml, ...).
  MANIFEST_DIR: ncs-matter
  STATE_FILE: sdk_sync_state.json

jobs:
  sync-and-build:
    runs-on: ubuntu-24.04
    container: ghcr.io/nrfconnect/sdk-nrf-toolchain:v3.4.0
    defaults:
      run:
        shell: bash
    outputs:
      failed: ${{ steps.twister.outputs.failed }}
    env:
      GH_TOKEN: ${{ secrets.NCS_NORDICBUILDER_ACTION_TOKEN }}
    steps:
      - name: Checkout the code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          path: ${{ env.MANIFEST_DIR }}
          persist-credentials: false

      - name: Install Python dependencies
        run: pip3 install -r "${MANIFEST_DIR}/scripts/sdk_sync/requirements.txt"

      - name: Load add-on config
        run: |
          python "${MANIFEST_DIR}/scripts/sdk_sync/sdk_sync.py" load-env \
            --config-file "${MANIFEST_DIR}/.github/addon.env" >> "$GITHUB_ENV"

      - name: Configure git credentials
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}/${MANIFEST_DIR}"
          git config --global --add safe.directory '*'
          git -C "${MANIFEST_DIR}" remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git config --global user.email "pylon@nordicsemi.no"
          git config --global user.name "Nordic Builder"

      # Rebase runs before resolving revisions so that any project configured with
      # rebase=true is pushed first; otherwise "resolve" would pin west.yml to the
      # stale pre-rebase commit.
      - name: Rebase configured manifest projects
        run: python "${MANIFEST_DIR}/scripts/sdk_sync/sdk_sync.py" rebase

      - name: Resolve manifest revisions
        env:
          REVISION_OVERRIDES: ${{ github.event.inputs.revisions }}
        run: |
          python "${MANIFEST_DIR}/scripts/sdk_sync/sdk_sync.py" resolve \
            --state-file "${STATE_FILE}" \
            --revisions "${REVISION_OVERRIDES}"

      - name: Upload sync state
        if: always()
        uses: actions/upload-artifact@c7d193f32edcb7bfad88892161225aeda64e9392 # v4
        with:
          name: sdk-sync-state
          path: ${{ env.STATE_FILE }}
          if-no-files-found: ignore

      - name: Restore west module path cache
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4
        with:
          path: west-path-cache
          key: west-path-cache-${{ hashFiles(format('{0}/west.yml', env.MANIFEST_DIR)) }}
          restore-keys: |
            west-path-cache-

      - name: Restore ccache
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4
        with:
          path: .ccache
          key: ccache-${{ env.MANIFEST_DIR }}-${{ hashFiles(format('{0}/west.yml', env.MANIFEST_DIR)) }}-${{ github.ref_name }}
          restore-keys: |
            ccache-${{ env.MANIFEST_DIR }}-${{ hashFiles(format('{0}/west.yml', env.MANIFEST_DIR)) }}-
            ccache-${{ env.MANIFEST_DIR }}-

      - name: Restore pip cache
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4
        with:
          path: .pip-cache
          key: pip-${{ env.MANIFEST_DIR }}-${{ hashFiles(format('{0}/west.yml', env.MANIFEST_DIR)) }}

      - name: Patch west.yml for local build
        run: |
          python "${MANIFEST_DIR}/scripts/sdk_sync/sdk_sync.py" patch \
            --state-file "${STATE_FILE}" \
            --west-yml "${MANIFEST_DIR}/west.yml"

      - name: Prepare west workspace
        run: |
          rm -rf .west
          west init -l "${MANIFEST_DIR}" --mf west.yml
          west update -n -o=--depth=1 --path-cache "${WEST_PATH_CACHE}"

      - name: Install west workspace Python dependencies
        if: env.SDK_SYNC_PIP_REQUIREMENTS != ''
        run: |
          mkdir -p "${PIP_CACHE_DIR}"
          IFS=',' read -ra REQ_FILES <<< "${SDK_SYNC_PIP_REQUIREMENTS}"
          for req in "${REQ_FILES[@]}"; do
            req="${req#"${req%%[![:space:]]*}"}"
            req="${req%"${req##*[![:space:]]}"}"
            test -f "${req}" || { echo "Missing requirements file: ${req}" >&2; exit 1; }
            pip3 install -r "${req}"
          done

      - name: Set up ccache
        run: |
          mkdir -p "${CCACHE_DIR}"
          ccache -z

      - name: Run Twister
        id: twister
        run: |
          source zephyr/zephyr-env.sh
          TWISTER_ARGS=(
            --inline-logs --build-only -N --verbose
            -T "${MANIFEST_DIR}/${SDK_SYNC_TWISTER_PATH}"
            --scenario "${SDK_SYNC_TWISTER_SCENARIO}"
          )
          if [ "${SDK_SYNC_TWISTER_ALL}" = "true" ]; then
            TWISTER_ARGS+=(--all)
          else
            TWISTER_ARGS+=(--integration)
          fi
          set +e
          zephyr/scripts/twister "${TWISTER_ARGS[@]}"
          TWISTER_RC=$?
          set -e
          if [ "${TWISTER_RC}" -ne 0 ]; then
            echo "failed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "failed=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Print ccache statistics
        if: always()
        run: ccache -s

  open-pr-on-failure:
    needs: sync-and-build
    if: |
      needs.sync-and-build.outputs.failed == 'true' ||
      github.event.inputs.force_pr == 'true'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.NCS_NORDICBUILDER_ACTION_TOKEN }}
    steps:
      - name: Checkout the code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Python dependencies
        run: pip3 install -r scripts/sdk_sync/requirements.txt

      - name: Load add-on config
        run: |
          python scripts/sdk_sync/sdk_sync.py load-env --config-file .github/addon.env >> "$GITHUB_ENV"

      - name: Download sync state
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: sdk-sync-state
          path: ${{ github.workspace }}

      - name: Configure git credentials
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git config --global user.email "pylon@nordicsemi.no"
          git config --global user.name "Nordic Builder"

      - name: Synchronize integration branch with main
        run: python scripts/sdk_sync/sdk_sync.py sync-integration

      - name: Push west.yml to sync test branch
        run: python scripts/sdk_sync/sdk_sync.py push --state-file "${STATE_FILE}"

      - name: Open sync pull request
        run: python scripts/sdk_sync/sdk_sync.py open-pr --state-file "${STATE_FILE}"
